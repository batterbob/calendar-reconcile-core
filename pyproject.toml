[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-reconcile-core"
version = "0.1.0rc1"
description = "Provider-neutral, bounded calendar evidence reconciliation"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "icalendar>=6"]
lint = ["ruff>=0.8"]
type = ["mypy>=1.10"]
build = ["build>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
python_version = "3.11"
