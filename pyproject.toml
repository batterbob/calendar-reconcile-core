[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-reconcile-core"
version = "0.1.0"
description = "Provider-neutral, bounded calendar evidence reconciliation"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
python_version = "3.11"
